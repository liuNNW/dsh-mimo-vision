# dsh-mimo-vision —— bundle 补丁层
#
# 安装方式（与 dsh-better-sidebar 相同，全部由命令行装配，不需要手工改 profile）：
#
#   dsh plugin --profile <profile> add dsh-mimo-vision
#
# 包在 package.json 里声明了 `dsh.bundle.patch`，安装时 profile 的
# `dsh.profile.bundles` 会自动追加本包，启动时把下面这条 insert 合并进插件树，
# 因此不再需要往 profile 的 cordis.patch.yml 里手工插行。
#
# ⚠ 迁移注意：如果你的 profile 的 cordis.patch.yml 里还留着旧版手工插入的
#   `- id: mimo-vision` / `name: "dsh-mimo-vision"`，请把它删掉，否则同一个插件
#   会被挂载两次（重复的 HTTP 前缀路由会让整棵插件树启动失败）。
#
# row id 仍保持 `mimo-vision`：它同时是本插件 HTTP 面与本地设置文件的命名空间，
# 改名会让已有用户配置失联。
#
# 双挂载保护：若同一个包已被别的聚合 bundle 以其它 id 挂载，本条自动让位。
- insert:
    - id: mimo-vision
      name: 'dsh-mimo-vision'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-mimo-vision' && e.options.id !== 'mimo-vision' && !e.disabled)"
